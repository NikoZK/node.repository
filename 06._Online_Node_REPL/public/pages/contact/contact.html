<h1> Contact</h1>

    <form action="/api/contact" method="POST">
        <fieldset>
        <label>Name</label>
        <input name="text" id="name" placeholder="Enter your name">

        <label>Email</label>
        <input name="email" id="email" placeholder="Enter your email">

        <label>Message</label>
        <textarea name="text" id="message" placeholder="Enter your message"> </textarea>

        <button type="submit">Submit</button>
        </fieldset>
    </form>
